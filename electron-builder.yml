# Bundle id: com.mira.app was arbitrary AND is already registered to another Apple
# team (Apple refuses to register it to ours), so it can't carry a provisioning
# profile. com.mickaelfm.mira is registered under team ZMKDR6H89Y, which is required
# for the WebAuthn keychain-access-groups entitlement (webauthn.ts).
appId: com.mickaelfm.mira
productName: Mira
directories:
  buildResources: build
# An ALLOW-list, never a deny-list: the app only needs the compiled code (out/)
# and the icon (resources/). electron-builder adds package.json and the
# production node_modules by itself. The old deny-list packed everything else
# lying at the repo root — the 1.1.0 release zip carried dist/ (847 MB of older
# builds), CLAUDE.local.md, skill/LOCAL.md and scratchpad/ (2026-09-26). The
# native addons ship through extraResources below, not the asar.
# bin/release.sh re-checks the asar against the same allow-list before publishing.
files:
  - 'out/**/*'
  - 'resources/**/*'
# Ship the compiled macOS location addon into Contents/Resources so the main
# process loads it by absolute path (see src/main/mac-location.ts). It is a signed
# nested Mach-O; electron-builder re-signs it with the app's certificate.
extraResources:
  - from: native/mira-location/build/Release/mira_location.node
    to: mira_location.node
  # Same deal for the Spaces addon (macOS virtual desktops, see src/main/spaces.ts).
  - from: native/mira-spaces/build/Release/mira_spaces.node
    to: mira_spaces.node
  # Same deal for the activation addon (suppress background reload foregrounding,
  # see src/main/mac-activation.ts).
  - from: native/mira-activation/build/Release/mira_activation.node
    to: mira_activation.node
  # Optional Kova terminal addon (libkova.a linked in, see native/mira-kova/). Its
  # build is skipped when libkova.a is absent or of another arch, so this ships the
  # dir's mira_kova.node only when there is one; build.mjs always leaves the dir.
  - from: native/mira-kova/build/Release
    to: .
    filter:
      - mira_kova.node
asarUnpack:
  - resources/**
# Declare Mira a handler for local HTML files so `open foo.html` (and a
# double-click in Finder) routes the file to Mira via the 'open-file' event
# (see src/main/index.ts). electron-builder expands this into CFBundleDocumentTypes
# in Info.plist. rank 'Default' offers Mira as a candidate handler; the user must
# still pick it once (Finder → Open With → Mira → Always) — declaring it does not
# seize the association from Safari/Chrome. macOS only honors this for the
# packaged bundle, never for `npm run dev`.
fileAssociations:
  - ext: html
    name: HTML Document
    role: Viewer
    rank: Default
  - ext: htm
    name: HTML Document
    role: Viewer
    rank: Default
win:
  executableName: mira
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # Developer ID signing, the same certificate and profile as the published release
  # (bin/release-build.cjs). Only an app with an embedded provisioning profile can carry
  # the AMFI-restricted keychain-access-groups entitlement (WebAuthn Touch ID, see
  # webauthn.ts). build/embedded.provisionprofile is the Developer ID profile "Mira
  # Developer ID" (team ZMKDR6H89Y, every Mac), valid as long as the certificate:
  # 2031-09-17. identity is the certificate name without its "Developer ID Application: "
  # prefix (electron-builder refuses the prefix). Until 2026-10-06 this was an Apple
  # Development certificate with a free-team profile that expired every 7 days.
  identity: 'Mickael Faivre-Maçon (ZMKDR6H89Y)'
  provisioningProfile: build/embedded.provisionprofile
  # Main app carries keychain-access-groups (it embeds the profile); the child
  # helpers must NOT (no embedded profile → AMFI kills them at launch), so they
  # inherit a profile-free copy. See build/entitlements.mac.inherit.plist.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # extendInfo must be a MAP, not a list: electron-builder's list form mangles a
  # nested value (CFBundleURLTypes landed under a bogus numeric key). Map form
  # merges each key into Info.plist at the top level as intended.
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    # Required for geolocation: Chromium on macOS gets a position from CoreLocation
    # (the OS location service), and macOS refuses to hand a location to an app that
    # does not declare this usage string — the symptom is a site reporting "precise
    # location could not be determined" even after the permission is granted.
    NSLocationWhenInUseUsageDescription: Mira shares your location with websites that request it, so maps and local results work.
    NSLocationUsageDescription: Mira shares your location with websites that request it, so maps and local results work.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    # Declare Mira a web browser: it handles http/https URL schemes, so macOS lists
    # it in the default-browser picker and routes clicked links to the 'open-url'
    # event (see src/main/index.ts). Without this, Mira can't be set as default.
    CFBundleURLTypes:
      - CFBundleURLName: com.mickaelfm.mira.web
        CFBundleTypeRole: Viewer
        CFBundleURLSchemes:
          - http
          - https
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
